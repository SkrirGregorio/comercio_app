<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Fondo circular con degradado -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Círculo de fondo -->
  <circle cx="50" cy="50" r="50" fill="url(#bgGradient)"/>
  
  <!-- Icono de tienda/edificio -->
  <g transform="translate(25, 25)">
    <!-- Techo de la tienda -->
    <path d="M 5 15 L 25 5 L 45 15 L 45 20 L 5 20 Z" fill="white" opacity="0.9"/>
    
    <!-- Cuerpo del edificio -->
    <rect x="5" y="20" width="40" height="30" fill="white" opacity="0.95"/>
    
    <!-- Puerta -->
    <rect x="18" y="32" width="14" height="18" fill="#4F46E5" opacity="0.8"/>
    <circle cx="28" cy="41" r="1.5" fill="white"/>
    
    <!-- Ventanas -->
    <rect x="10" y="25" width="8" height="6" fill="#4F46E5" opacity="0.6"/>
    <rect x="32" y="25" width="8" height="6" fill="#4F46E5" opacity="0.6"/>
    
    <!-- Toldo -->
    <path d="M 5 20 L 5 25 L 15 23 L 15 20 Z" fill="#EF4444" opacity="0.8"/>
    <path d="M 35 20 L 35 23 L 45 25 L 45 20 Z" fill="#EF4444" opacity="0.8"/>
  </g>
</svg>
