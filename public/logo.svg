<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#111827" stroke="#E5E7EB" stroke-width="2"/>
  
  <!-- Store/Commerce Icon -->
  <g transform="translate(50, 55)">
    <!-- Roof/Awning -->
    <path d="M 0 20 L 50 0 L 100 20 L 95 30 L 5 30 Z" fill="#F9FAFB" stroke="#D1D5DB" stroke-width="2"/>
    
    <!-- Building -->
    <rect x="10" y="30" width="80" height="60" fill="#FFFFFF" stroke="#D1D5DB" stroke-width="2"/>
    
    <!-- Door -->
    <rect x="35" y="55" width="30" height="35" rx="2" fill="#111827"/>
    
    <!-- Window Left -->
    <rect x="20" y="40" width="15" height="12" rx="1" fill="#E5E7EB"/>
    <line x1="27.5" y1="40" x2="27.5" y2="52" stroke="#D1D5DB" stroke-width="1.5"/>
    
    <!-- Window Right -->
    <rect x="65" y="40" width="15" height="12" rx="1" fill="#E5E7EB"/>
    <line x1="72.5" y1="40" x2="72.5" y2="52" stroke="#D1D5DB" stroke-width="1.5"/>
    
    <!-- Decorative stripes on awning -->
    <line x1="10" y1="25" x2="15" y2="30" stroke="#E5E7EB" stroke-width="2"/>
    <line x1="25" y1="18" x2="30" y2="30" stroke="#E5E7EB" stroke-width="2"/>
    <line x1="40" y1="13" x2="45" y2="30" stroke="#E5E7EB" stroke-width="2"/>
    <line x1="55" y1="13" x2="60" y2="30" stroke="#E5E7EB" stroke-width="2"/>
    <line x1="70" y1="18" x2="75" y2="30" stroke="#E5E7EB" stroke-width="2"/>
    <line x1="85" y1="25" x2="90" y2="30" stroke="#E5E7EB" stroke-width="2"/>
  </g>
  
  <!-- Optional: Add a subtle shadow effect -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="url(#gradient)" stroke-width="3"/>
  
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E5E7EB;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#9CA3AF;stop-opacity:0.5" />
    </linearGradient>
  </defs>
</svg>
