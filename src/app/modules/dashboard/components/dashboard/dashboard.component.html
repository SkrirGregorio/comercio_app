<div class="min-h-screen bg-gray-50">
  <!-- Dashboard Header -->
  <div class="bg-white border-b border-gray-200">
    <div class="container py-6">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-3xl font-bold text-gray-900">Panel de Control</h1>
          <p class="text-gray-600 mt-1">Gestiona tu presencia en Comercio Local</p>
        </div>
        <a routerLink="/" class="px-6 py-2 rounded-xl border border-gray-200 text-gray-900 font-medium hover:border-gray-900 transition-colors">
          Volver al Inicio
        </a>
      </div>
    </div>
  </div>

  <div class="container py-8">
    <div class="grid lg:grid-cols-12 gap-8">
      <!-- Sidebar Navigation -->
      <aside class="lg:col-span-3">
        <div class="bg-white rounded-2xl border border-gray-200 p-6 sticky top-8">
          <!-- User Info -->
          @if (user()) {
            <div class="flex items-center gap-3 pb-6 border-b border-gray-100">
              <div class="h-12 w-12 rounded-xl bg-gray-900 flex items-center justify-center">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                </svg>
              </div>
              <div class="flex-1 min-w-0">
                <p class="text-sm font-semibold text-gray-900 truncate">{{ user()!.nombre }}</p>
                <p class="text-xs text-gray-500 truncate">{{ user()!.email }}</p>
              </div>
            </div>
          }

          <!-- Navigation Links -->
          <nav class="mt-6 space-y-2">
            <a 
              routerLink="/dashboard/empresas" 
              routerLinkActive="bg-gray-900 text-white"
              [routerLinkActiveOptions]="{ exact: false }"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-50 transition-colors [&.bg-gray-900]:hover:bg-gray-800"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
              </svg>
              <span class="font-medium">Mis Empresas</span>
            </a>

            <a 
              routerLink="/dashboard/mapa-empresas" 
              routerLinkActive="bg-gray-900 text-white"
              class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-50 transition-colors [&.bg-gray-900]:hover:bg-gray-800"
            >
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
              </svg>
              <span class="font-medium">Mapa de Empresas</span>
            </a>

    

            <!-- Admin Only Section -->
            @if (user()?.role === 'admin') {
              <div class="pt-4 mt-4 border-t border-gray-200">
                <p class="px-4 text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Administración</p>
                <a 
                  routerLink="/dashboard/usuarios" 
                  routerLinkActive="bg-gray-900 text-white"
                  class="flex items-center gap-3 px-4 py-3 rounded-xl text-gray-700 hover:bg-gray-50 transition-colors [&.bg-gray-900]:hover:bg-gray-800"
                >
                  <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                  </svg>
                  <span class="font-medium">Usuarios</span>
                </a>
              </div>
            }

          </nav>
        </div>
      </aside>

      <!-- Main Content Area -->
      <main class="lg:col-span-9">
        <router-outlet></router-outlet>
      </main>
    </div>
  </div>
</div>
