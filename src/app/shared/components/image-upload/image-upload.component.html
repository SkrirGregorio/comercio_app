<div class="space-y-4">
  <!-- Preview de la imagen -->
  @if (preview()) {
    <div class="relative inline-block">
      <img [src]="preview()" alt="Preview" 
           class="h-40 w-40 object-cover rounded-xl border-2 border-gray-200 shadow-sm" />
      
      @if (!uploading()) {
        <button 
          type="button"
          (click)="removeImage()"
          class="absolute -top-2 -right-2 h-8 w-8 rounded-full bg-red-500 text-white hover:bg-red-600 transition-colors flex items-center justify-center shadow-md">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
          </svg>
        </button>
      }
    </div>
  }

  <!-- Botón de selección -->
  <div class="flex items-center gap-4">
    <input 
      #fileInput
      type="file" 
      class="hidden" 
      [accept]="accept()" 
      (change)="onFileSelect($event)">
    
    <button
      type="button"
      (click)="fileInput.click()"
      [disabled]="uploading()"
      class="px-4 py-2 rounded-xl border-2 border-gray-300 bg-white hover:bg-gray-50 font-medium text-gray-700 transition-colors disabled:opacity-50 disabled:cursor-not-allowed flex items-center gap-2">
      @if (uploading()) {
        <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
        Subiendo...
      } @else {
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        {{ label() }}
      }
    </button>

    <span class="text-sm text-gray-500">
      Máximo {{ getMaxSizeText() }} · JPG, PNG, WebP
    </span>
  </div>

  <!-- Progress bar -->
  @if (uploading() && progress() > 0) {
    <div class="space-y-1">
      <div class="flex items-center justify-between text-sm">
        <span class="text-gray-600">Subiendo imagen...</span>
        <span class="font-semibold text-gray-900">{{ progress() }}%</span>
      </div>
      <div class="h-2 bg-gray-200 rounded-full overflow-hidden">
        <div 
          class="h-full bg-black transition-all duration-300 ease-out"
          [style.width.%]="progress()">
        </div>
      </div>
    </div>
  }

  <!-- URL de imagen subida (solo para debug/info) -->
  @if (uploadedUrl() && !uploading()) {
    <div class="p-3 bg-green-50 border border-green-200 rounded-xl">
      <div class="flex items-start gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-green-600 flex-shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
        </svg>
        <div class="flex-1 min-w-0">
          <p class="text-sm font-medium text-green-800">Imagen subida exitosamente</p>
          <p class="text-xs text-green-600 truncate mt-0.5">{{ uploadedUrl() }}</p>
        </div>
      </div>
    </div>
  }

  <!-- Mensaje de error -->
  @if (error()) {
    <div class="p-3 bg-red-50 border border-red-200 rounded-xl">
      <div class="flex items-start gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-600 flex-shrink-0 mt-0.5" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
        </svg>
        <p class="text-sm text-red-800">{{ error() }}</p>
      </div>
    </div>
  }
</div>
